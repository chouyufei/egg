           C 144 394 192 428 256 428
           C 320 428 368 394 368 332
           C 368 264 334 158 256 158 Z"
        fill="url(#eggHi)"/>

  <!-- 凤羽 -->
  <path d="M 248 168
           C 230 132 234 92 262 70
           C 254 90 264 104 280 108
           C 270 122 278 134 294 132
           C 280 148 290 162 302 160
           C 286 176 270 180 248 168 Z"
        fill="#f08a00"/>

  <!-- 凤 字 -->
  <text x="256" y="378"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
