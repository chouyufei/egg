<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e0"/>
      <stop offset="1" stop-color="#fbe7a4"/>
    </linearGradient>
    <linearGradient id="bgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="0.55" stop-color="#f6b821"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a40d"/>
      <stop offset="1" stop-color="#8a6b15"/>
    </linearGradient>
    <radialGradient id="eggHi" cx="0.35" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </radialGradient>
  </defs>

  <!-- 海报底 -->
  <rect width="800" height="1200" fill="url(#posterBg)"/>

  <!-- 顶部装饰光晕 -->
  <circle cx="400" cy="350" r="320" fill="#f6b821" opacity="0.12"/>
  <circle cx="400" cy="350" r="220" fill="#f6b821" opacity="0.15"/>

  <!-- 中央 logo（图标） -->
  <g transform="translate(280,180)">
    <rect width="240" height="240" rx="54" fill="url(#bgGold)"/>
    <path d="M 120 70
             C 84 70 66 120 66 154
             C 66 188 90 208 120 208
             C 150 208 174 188 174 154
             C 174 120 156 70 120 70 Z"
          fill="url(#eggHi)"/>
    <path d="M 116 74
             C 108 56 110 38 124 28
             C 121 36 124 42 130 44
             C 127 50 130 56 136 56
             C 130 62 134 68 140 67
             C 132 75 124 78 116 74 Z"
          fill="#f08a00"/>
    <text x="120" y="178"
          font-family="'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="68" font-weight="900" text-anchor="middle"
          fill="#e0a40d">凤</text>
  </g>

  <!-- 字标 -->
  <text x="400" y="560"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="120" font-weight="900" text-anchor="middle"
        fill="url(#textGold)" letter-spacing="12">凤伯乐</text>

  <!-- 拼音 -->
  <text x="400" y="612"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="600" text-anchor="middle"
        fill="#b78300" letter-spacing="16">FENG · BO · LE</text>

  <!-- 分隔金线 -->
  <line x1="250" y1="660" x2="370" y2="660" stroke="#e0a40d" stroke-width="3"/>
  <circle cx="400" cy="660" r="6" fill="#e0a40d"/>
  <line x1="430" y1="660" x2="550" y2="660" stroke="#e0a40d" stroke-width="3"/>

  <!-- 主 slogan -->
  <text x="400" y="752"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="76" font-weight="800" text-anchor="middle"
        fill="#1d1d1f" letter-spacing="14">为好蛋找伯乐</text>

  <!-- 副 slogan -->
  <text x="400" y="812"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="500" text-anchor="middle"
        fill="#5a4810" letter-spacing="10">让每一颗鸡蛋遇见对的人</text>

  <!-- 三大特色卡片 -->
  <g transform="translate(80,900)">
    <!-- 卡 1 -->
    <rect x="0" y="0" width="200" height="160" rx="20" fill="#ffffff" opacity="0.85"/>
    <text x="100" y="60" font-size="48" text-anchor="middle">🐔</text>
    <text x="100" y="105" font-family="'PingFang SC',sans-serif" font-size="26" font-weight="700"
          text-anchor="middle" fill="#1d1d1f">养殖直供</text>
    <text x="100" y="138" font-family="'PingFang SC',sans-serif" font-size="20"
          text-anchor="middle" fill="#8a6b15">省去层层中间商</text>

    <!-- 卡 2 -->
    <rect x="220" y="0" width="200" height="160" rx="20" fill="#ffffff" opacity="0.85"/>
    <text x="320" y="60" font-size="48" text-anchor="middle">⚖️</text>
    <text x="320" y="105" font-family="'PingFang SC',sans-serif" font-size="26" font-weight="700"
          text-anchor="middle" fill="#1d1d1f">公开竞价</text>
    <text x="320" y="138" font-family="'PingFang SC',sans-serif" font-size="20"
          text-anchor="middle" fill="#8a6b15">透明 · 公平 · 实时</text>

    <!-- 卡 3 -->
    <rect x="440" y="0" width="200" height="160" rx="20" fill="#ffffff" opacity="0.85"/>
    <text x="540" y="60" font-size="48" text-anchor="middle">🛡️</text>
    <text x="540" y="105" font-family="'PingFang SC',sans-serif" font-size="26" font-weight="700"
          text-anchor="middle" fill="#1d1d1f">保证金机制</text>
    <text x="540" y="138" font-family="'PingFang SC',sans-serif" font-size="20"
          text-anchor="middle" fill="#8a6b15">双方诚信履约</text>
  </g>

  <!-- 底部行动号召 -->
  <rect x="240" y="1100" width="320" height="72" rx="36" fill="url(#bgGold)"/>
  <text x="400" y="1148"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="32" font-weight="700" text-anchor="middle"
        fill="#1d1d1f" letter-spacing="6">扫码即刻入驻</text>
</svg>
